name: Publish Package

on:
  release:
    types:
        - published
  workflow_dispatch: # enables manual triggering

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11" 

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python3 -

    - name: Install Dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install toml requests packaging

    - name: Validate Version
      run: |
        # `curl` on an unpublished package returns 404 with body {"message": "Not Found"};
        # `jq -r .info.version` then prints the literal string "null" and exits 0, and
        # `parse("null")` raises InvalidVersion — so without the `// empty` fallback the
        # FIRST EVER release of a package is guaranteed to fail here, with an error that
        # reads like a version-parsing bug rather than "not published yet".
        latest_version=$(curl -s https://pypi.org/pypi/views-postprocessing/json | jq -r '.info.version // empty')
        new_version=$(python -c "import toml; print(toml.load('pyproject.toml')['tool']['poetry']['version'])")
        if [ -z "$latest_version" ]; then
          echo "views-postprocessing is not on PyPI yet — first release, nothing to compare $new_version against."
        else
          python -c "from packaging.version import parse; assert parse('$new_version') > parse('$latest_version'), 'Version must be higher than $latest_version'"
        fi
  
    - name: Publish to PyPI
      run: poetry publish --build --username __token__ --password ${{ secrets.PYPI_TOKEN }}
